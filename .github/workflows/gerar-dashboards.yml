name: Gerar Dashboards Mensais

on:
  # Roda todo dia 5 do mês às 08h (horário de Brasília = UTC-3)
  schedule:
    - cron: '0 11 5 * *'

  # Permite rodar manualmente com escolha do mês
  workflow_dispatch:
    inputs:
      mes:
        description: 'Mês de referência (YYYY-MM). Deixe vazio para usar o mês anterior.'
        required: false
        default: ''
      condominio:
        description: 'ID do condomínio (opcional — deixe vazio para processar todos)'
        required: false
        default: ''

jobs:
  processar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Definir mês de referência
        id: mes
        run: |
          if [ -n "${{ github.event.inputs.mes }}" ]; then
            echo "MES=${{ github.event.inputs.mes }}" >> $GITHUB_ENV
          else
            # Mês anterior
            echo "MES=$(date -d 'last month' +'%Y-%m')" >> $GITHUB_ENV
          fi

      - name: Processar dashboards
        run: |
          EXTRA=""
          if [ -n "${{ github.event.inputs.condominio }}" ]; then
            EXTRA="--condominio ${{ github.event.inputs.condominio }}"
          fi
          python scripts/processar.py --mes $MES $EXTRA

      - name: Deploy para GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          destination_dir: dashboards/${{ env.MES }}
          keep_files: true          # mantém meses anteriores online
          commit_message: "Dashboard ${{ env.MES }} — gerado automaticamente"
