name: Deploy Vercel (Produção)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy para Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repositório completo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Instalar dependências do admin
        working-directory: admin
        run: npm ci

      - name: Gerar snapshots (lê docs/ e cria snapshots.json)
        working-directory: admin
        run: node scripts/generate-snapshots.mjs

      - name: Zerar rootDirectory no projeto Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          RESP=$(curl -sfX PATCH \
            "https://api.vercel.com/v9/projects/prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7?teamId=team_ZcZYzyZxy59xsCSB41wUYrpv" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"rootDirectory": null}' 2>&1)
          echo "API response: $RESP"

      - name: vercel pull
        working-directory: admin
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ZcZYzyZxy59xsCSB41wUYrpv
          VERCEL_PROJECT_ID: prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: vercel build
        working-directory: admin
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ZcZYzyZxy59xsCSB41wUYrpv
          VERCEL_PROJECT_ID: prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: debug output
        working-directory: admin
        run: |
          echo "=== project.json ==="
          cat .vercel/project.json
          echo ""
          echo "=== output/config.json ==="
          cat .vercel/output/config.json 2>/dev/null || echo "NAO ENCONTRADO"
          echo ""
          echo "=== tamanho do output ==="
          du -sh .vercel/output/ 2>/dev/null || echo "NAO ENCONTRADO"

      - name: vercel deploy --prebuilt
        working-directory: admin
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ZcZYzyZxy59xsCSB41wUYrpv
          VERCEL_PROJECT_ID: prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7
        run: |
          vercel deploy --prebuilt --prod --yes --token=$VERCEL_TOKEN > /tmp/deploy.log 2>&1 || {
            cat /tmp/deploy.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
          echo "Deploy URL: $(cat /tmp/deploy.log)"
          echo "Producao: https://sindicompany-dashboards.vercel.app"
