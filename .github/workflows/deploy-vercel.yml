name: Deploy Vercel (Produção)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy para Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repositório completo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Instalar dependências do admin
        working-directory: admin
        run: npm ci

      - name: Gerar snapshots
        working-directory: admin
        run: node scripts/generate-snapshots.mjs

      - name: Restaurar rootDirectory="admin" no projeto Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -sfX PATCH \
            "https://api.vercel.com/v9/projects/prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7?teamId=team_ZcZYzyZxy59xsCSB41wUYrpv" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"rootDirectory": "admin"}' && echo "rootDirectory=admin"

      - name: vercel pull
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ZcZYzyZxy59xsCSB41wUYrpv
          VERCEL_PROJECT_ID: prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: vercel build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ZcZYzyZxy59xsCSB41wUYrpv
          VERCEL_PROJECT_ID: prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: vercel deploy --prebuilt
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ZcZYzyZxy59xsCSB41wUYrpv
          VERCEL_PROJECT_ID: prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7
        run: |
          # Deploy pode sair com 1 se o alias automático falhar; capturamos a URL mesmo assim
          vercel deploy --prebuilt --prod --yes --token=$VERCEL_TOKEN > /tmp/out.txt 2>&1 || true
          cat /tmp/out.txt
          DEPLOY_URL=$(grep -oE 'https://sindicompany-dashboards-[a-z0-9]+\.vercel\.app' /tmp/out.txt | head -1)
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Deploy não gerou URL"
            cat /tmp/out.txt | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "Deploy URL: $DEPLOY_URL"

      - name: Setar alias de produção
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ZcZYzyZxy59xsCSB41wUYrpv
          VERCEL_PROJECT_ID: prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7
        run: |
          DEPLOY_URL="${{ steps.deploy.outputs.DEPLOY_URL }}"
          vercel alias set "$DEPLOY_URL" sindicompany-dashboards.vercel.app \
            --token=$VERCEL_TOKEN --yes
          echo "Produção: https://sindicompany-dashboards.vercel.app"
