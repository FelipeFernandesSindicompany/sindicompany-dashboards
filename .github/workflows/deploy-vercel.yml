name: Deploy Vercel (Produção)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy para Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repositório completo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Instalar dependências do admin
        working-directory: admin
        run: npm ci

      - name: Gerar snapshots
        working-directory: admin
        run: node scripts/generate-snapshots.mjs

      - name: Restaurar rootDirectory="admin" no projeto Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -sfX PATCH \
            "https://api.vercel.com/v9/projects/prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7?teamId=team_ZcZYzyZxy59xsCSB41wUYrpv" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"rootDirectory": "admin"}' && echo "rootDirectory=admin"

      - name: vercel pull
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ZcZYzyZxy59xsCSB41wUYrpv
          VERCEL_PROJECT_ID: prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: vercel build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ZcZYzyZxy59xsCSB41wUYrpv
          VERCEL_PROJECT_ID: prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: vercel deploy --prebuilt + promover via API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ZcZYzyZxy59xsCSB41wUYrpv
          VERCEL_PROJECT_ID: prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7
        run: |
          # Timestamp antes do deploy para identificar o deployment depois
          BEFORE_MS=$(date -u +%s%3N)
          echo "Timestamp antes: $BEFORE_MS"

          # Deploy sem --prod (evita falha na atribuição de alias)
          NO_COLOR=1 vercel deploy --prebuilt --yes --token=$VERCEL_TOKEN 2>&1 | tee /tmp/out.txt || true
          echo "=== OUTPUT ==="
          cat /tmp/out.txt

          # Aguardar propagação
          sleep 5

          # Buscar o deployment mais recente criado após o timestamp
          DEPLOY_INFO=$(curl -sf \
            "https://api.vercel.com/v13/deployments?teamId=team_ZcZYzyZxy59xsCSB41wUYrpv&projectId=prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7&limit=5" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          echo "=== DEPLOYMENTS RECENTES ==="
          echo "$DEPLOY_INFO" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for d in data.get('deployments', [])[:5]:
              print(f'  {d[\"uid\"]} | {d.get(\"url\",\"?\")} | {d.get(\"createdAt\",0)}')
          "

          DEPLOY_ID=$(echo "$DEPLOY_INFO" | python3 -c "
          import sys, json
          import os
          data = json.load(sys.stdin)
          before = int(os.environ.get('BEFORE_MS', '0'))
          for d in data.get('deployments', []):
              if d.get('createdAt', 0) >= before:
                  print(d['uid'])
                  break
          " BEFORE_MS="$BEFORE_MS")

          echo "Deployment ID: $DEPLOY_ID"
          if [ -z "$DEPLOY_ID" ]; then
            echo "::error::Nenhum deployment novo encontrado (criado após $BEFORE_MS)"
            exit 1
          fi

          # Promover para produção via API
          echo "Promovendo $DEPLOY_ID..."
          PROMO=$(curl -sX POST \
            "https://api.vercel.com/v10/deployments/$DEPLOY_ID/promote?teamId=team_ZcZYzyZxy59xsCSB41wUYrpv" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' -w "\nHTTP_STATUS:%{http_code}")
          echo "Resposta promoção: $PROMO"
          HTTP_CODE=$(echo "$PROMO" | grep -oE 'HTTP_STATUS:[0-9]+' | cut -d: -f2)
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "204" ]; then
            echo "::error::Promoção falhou com HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Produção: https://sindicompany-dashboards.vercel.app"
