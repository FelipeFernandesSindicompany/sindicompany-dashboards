name: Deploy Vercel (Produção)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy para Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repositório completo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Instalar dependências do admin
        working-directory: admin
        run: npm ci

      - name: Gerar snapshots
        working-directory: admin
        run: node scripts/generate-snapshots.mjs

      - name: Restaurar rootDirectory="admin" no projeto Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -sfX PATCH \
            "https://api.vercel.com/v9/projects/prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7?teamId=team_ZcZYzyZxy59xsCSB41wUYrpv" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"rootDirectory": "admin"}' && echo "rootDirectory=admin"

      - name: vercel pull
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ZcZYzyZxy59xsCSB41wUYrpv
          VERCEL_PROJECT_ID: prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: vercel build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ZcZYzyZxy59xsCSB41wUYrpv
          VERCEL_PROJECT_ID: prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: vercel deploy --prebuilt --prod (captura output completo)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ZcZYzyZxy59xsCSB41wUYrpv
          VERCEL_PROJECT_ID: prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7
        run: |
          # Captura output e exit code
          NO_COLOR=1 vercel deploy --prebuilt --prod --yes --token=$VERCEL_TOKEN > /tmp/out.txt 2>&1
          DEPLOY_EXIT=$?

          # Expõe TODAS as linhas como annotations para serem visíveis via API
          while IFS= read -r line; do
            echo "::notice::DEPLOY: $line"
          done < /tmp/out.txt

          echo "Exit code: $DEPLOY_EXIT"

          # Extrai URL mesmo com falha
          DEPLOY_URL=$(cat /tmp/out.txt | grep -oiE 'https://[^ ]+vercel\.app[^ ]*' | grep -v '^https://sindicompany-dashboards\.vercel\.app$' | head -1)
          PROD_URL=$(cat /tmp/out.txt | grep -oiE 'https://sindicompany-dashboards\.vercel\.app[^ ]*' | head -1)

          echo "Preview URL: $DEPLOY_URL"
          echo "Prod URL: $PROD_URL"

          if [ -n "$DEPLOY_URL" ]; then
            echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_OUTPUT
          fi

          # Falha apenas se não houver nenhuma URL (deployment não criado)
          if [ -z "$DEPLOY_URL" ] && [ -z "$PROD_URL" ]; then
            echo "::error::Nenhuma URL de deployment encontrada"
            exit 1
          fi

          echo "Deploy concluído com exit=$DEPLOY_EXIT (alias pode ter falhado)"
