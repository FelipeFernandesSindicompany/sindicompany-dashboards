name: Deploy Vercel (Produção)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy para Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repositório completo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Instalar dependências do admin
        working-directory: admin
        run: npm ci

      - name: Gerar snapshots (lê docs/ e cria snapshots.json)
        working-directory: admin
        run: node scripts/generate-snapshots.mjs

      - name: Zerar rootDirectory no projeto Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -sfX PATCH \
            "https://api.vercel.com/v9/projects/prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7?teamId=team_ZcZYzyZxy59xsCSB41wUYrpv" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"rootDirectory": null}'
          echo "rootDirectory zerado"

      - name: vercel pull
        working-directory: admin
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ZcZYzyZxy59xsCSB41wUYrpv
          VERCEL_PROJECT_ID: prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: vercel build
        working-directory: admin
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ZcZYzyZxy59xsCSB41wUYrpv
          VERCEL_PROJECT_ID: prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: vercel deploy --prebuilt (sem --prod)
        id: deploy
        working-directory: admin
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ZcZYzyZxy59xsCSB41wUYrpv
          VERCEL_PROJECT_ID: prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --yes --token=$VERCEL_TOKEN 2>&1 | grep -oE 'https://[a-z0-9-]+\.vercel\.app' | head -1)
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "Deploy URL: $DEPLOY_URL"
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Deploy não gerou URL"
            exit 1
          fi

      - name: vercel promote para produção
        working-directory: admin
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ZcZYzyZxy59xsCSB41wUYrpv
          VERCEL_PROJECT_ID: prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7
        run: |
          DEPLOY_URL="${{ steps.deploy.outputs.DEPLOY_URL }}"
          vercel promote "$DEPLOY_URL" --yes --token=$VERCEL_TOKEN
          echo "Promovido: https://sindicompany-dashboards.vercel.app"
