name: Deploy Vercel (Produção)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy para Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repositório completo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Instalar dependências do admin
        working-directory: admin
        run: npm ci

      - name: Gerar snapshots
        working-directory: admin
        run: node scripts/generate-snapshots.mjs

      - name: Restaurar rootDirectory="admin" no projeto Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -sfX PATCH \
            "https://api.vercel.com/v9/projects/prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7?teamId=team_ZcZYzyZxy59xsCSB41wUYrpv" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"rootDirectory": "admin"}' && echo "rootDirectory=admin"

      - name: vercel pull
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ZcZYzyZxy59xsCSB41wUYrpv
          VERCEL_PROJECT_ID: prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: vercel build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ZcZYzyZxy59xsCSB41wUYrpv
          VERCEL_PROJECT_ID: prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: vercel deploy (diagnóstico completo)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ZcZYzyZxy59xsCSB41wUYrpv
          VERCEL_PROJECT_ID: prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7
        run: |
          # Desabilita exit-on-error para capturar output do vercel deploy
          set +e

          # Executa o deploy e captura output e exit code
          NO_COLOR=1 vercel deploy --prebuilt --prod --yes --token=$VERCEL_TOKEN > /tmp/out.txt 2>&1
          DEPLOY_EXIT=$?

          # Reabilita exit-on-error
          set -e

          # Expõe output como annotations (máx ~40 linhas)
          LINE_COUNT=$(wc -l < /tmp/out.txt)
          echo "::notice::=== DEPLOY EXIT=$DEPLOY_EXIT LINES=$LINE_COUNT ==="
          head -40 /tmp/out.txt | while IFS= read -r line; do
            echo "::notice::OUT: $line"
          done
          if [ "$LINE_COUNT" -gt 40 ]; then
            echo "::notice::=== ... $(( LINE_COUNT - 40 )) linhas omitidas ... ==="
            tail -10 /tmp/out.txt | while IFS= read -r line; do
              echo "::notice::TAIL: $line"
            done
          fi

          # Também testa API Vercel diretamente
          echo "::notice::=== TESTE API VERCEL ==="
          API_RESP=$(curl -s -w "\nHTTP:%{http_code}" \
            "https://api.vercel.com/v13/deployments?teamId=team_ZcZYzyZxy59xsCSB41wUYrpv&projectId=prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7&limit=3" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          HTTP_CODE=$(echo "$API_RESP" | grep -oE 'HTTP:[0-9]+' | cut -d: -f2)
          echo "::notice::API HTTP=$HTTP_CODE"
          echo "$API_RESP" | head -c 500 | while IFS= read -r line; do
            echo "::notice::API: $line"
          done

          # Falha se o deploy não criou nenhum URL
          if [ $DEPLOY_EXIT -ne 0 ]; then
            echo "::error::vercel deploy saiu com $DEPLOY_EXIT"
            exit $DEPLOY_EXIT
          fi
          echo "Produção: https://sindicompany-dashboards.vercel.app"
