name: Deploy Vercel (Produção)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy para Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repositório completo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Instalar dependências do admin
        working-directory: admin
        run: npm ci

      - name: Gerar snapshots (lê docs/ e cria snapshots.json)
        working-directory: admin
        run: node scripts/generate-snapshots.mjs

      - name: vercel pull
        working-directory: admin
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ZcZYzyZxy59xsCSB41wUYrpv
          VERCEL_PROJECT_ID: prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: patch rootDirectory
        working-directory: admin
        run: |
          node -e "
            const f='.vercel/project.json';
            const d=JSON.parse(require('fs').readFileSync(f,'utf8'));
            d.settings.rootDirectory=null;
            require('fs').writeFileSync(f,JSON.stringify(d,null,2));
            console.log('rootDirectory zerado');
          "

      - name: vercel build
        working-directory: admin
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ZcZYzyZxy59xsCSB41wUYrpv
          VERCEL_PROJECT_ID: prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: check .vercel/output
        working-directory: admin
        run: |
          echo "=== .vercel/ tree ==="
          find .vercel -maxdepth 4 2>/dev/null | head -40 || echo "NADA em .vercel/"
          echo "=== output config ==="
          cat .vercel/output/config.json 2>/dev/null || echo "config.json não encontrado"

      - name: vercel deploy --prebuilt (com erro exposto)
        working-directory: admin
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ZcZYzyZxy59xsCSB41wUYrpv
          VERCEL_PROJECT_ID: prj_W66oRPPeGYSpkGWdwIA3IQrMlJo7
        run: |
          vercel deploy --prebuilt --prod --yes --token=$VERCEL_TOKEN > deploy_out.txt 2>&1 || {
            echo "::error::vercel deploy falhou. Saída:"
            while IFS= read -r line; do
              echo "::error::$line"
            done < deploy_out.txt
            exit 1
          }
          echo "✅ Deploy URL: $(cat deploy_out.txt)"
          echo "🌐 Produção: https://sindicompany-dashboards.vercel.app"
